name: Publicar versão de teste

# Só roda quando a proprietária clicar em "Run workflow" (Actions → Publicar versão de teste).
# Usa exclusivamente as contas Cloudflare e Supabase da proprietária, via segredos do repositório.
on:
  workflow_dispatch:
    inputs:
      aplicar_migrations:
        description: "Aplicar as migrations no Supabase de teste"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-teste
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: teste
    timeout-minutes: 30
    env:
      APP_ENV: preview
      NEXT_PUBLIC_SITE_URL: ${{ vars.TESTE_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.TESTE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TESTE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Conferir configuração (sem mostrar valores)
        run: |
          for v in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Falta configurar $v (ver docs/deploy-teste.md)"; exit 1; }
          done

      - name: Migrations no Supabase de teste
        if: inputs.aplicar_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.TESTE_SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "${{ vars.TESTE_SUPABASE_PROJECT_REF }}"
          npx supabase db push

      - name: Build para Cloudflare Workers
        run: npm run cf:build

      - name: Publicar no Workers (ambiente preview)
        run: npx wrangler deploy --env preview --var "NEXT_PUBLIC_SITE_URL:${NEXT_PUBLIC_SITE_URL}" --var "NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL}" --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

      - name: Segredos do Worker
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.TESTE_SUPABASE_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.TESTE_CRON_SECRET }}
        run: |
          [ -n "$SUPABASE_SECRET_KEY" ] && printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --env preview
          [ -n "$CRON_SECRET" ] && printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET --env preview
          true
