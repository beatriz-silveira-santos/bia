name: Publicar versão de teste

# Publica a versão de TESTE (workers.dev) usando somente as contas Cloudflare e Supabase da proprietária.
# Roda automaticamente a cada envio para os ramos abaixo e também pelo botão "Run workflow".
# Enquanto as chaves não estiverem cadastradas no ambiente "teste" do GitHub, o job apenas avisa e encerra.
on:
  push:
    branches: [main, feat/loja-inicial]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-teste
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: bia-store
    timeout-minutes: 30
    env:
      APP_ENV: preview
      NEXT_PUBLIC_SITE_URL: ${{ vars.TESTE_SITE_URL || secrets.TESTE_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.TESTE_SUPABASE_URL || secrets.TESTE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TESTE_SUPABASE_PUBLISHABLE_KEY || secrets.TESTE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.TESTE_SUPABASE_PROJECT_REF || secrets.TESTE_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.TESTE_SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SECRET_KEY: ${{ secrets.TESTE_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Conferir configuração (sem mostrar valores)
        id: cfg
        run: |
          missing=""
          for v in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD SUPABASE_SECRET_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          bad=""
          # Endereço do teste: se não informado corretamente, descobre o subdomínio workers.dev pela API da Cloudflare
          if ! [[ "$NEXT_PUBLIC_SITE_URL" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev/?$ ]] || [[ "$NEXT_PUBLIC_SITE_URL" == *SEU-SUBDOMINIO* ]]; then
            if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
              sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
              if [ -n "$sub" ]; then
                NEXT_PUBLIC_SITE_URL="https://biastore-preview.$sub.workers.dev"
                echo "::notice::Endereço do teste detectado automaticamente: $NEXT_PUBLIC_SITE_URL"
              else
                echo "::error::Não encontrei o subdomínio workers.dev da conta. Abra 'Workers & Pages' no Cloudflare uma vez para ativá-lo."
                bad="$bad TESTE_SITE_URL"
              fi
            else
              bad="$bad TESTE_SITE_URL"
            fi
          fi
          [[ -z "$NEXT_PUBLIC_SUPABASE_URL" || "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9]{20}\.supabase\.co/?$ ]] || bad="$bad TESTE_SUPABASE_URL"
          [[ -z "$SUPABASE_PROJECT_REF" || "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || bad="$bad TESTE_SUPABASE_PROJECT_REF"
          [[ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" =~ ^(sb_publishable_|eyJ) ]] || bad="$bad TESTE_SUPABASE_PUBLISHABLE_KEY"
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" || "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || bad="$bad CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$bad" ]; then
            echo "::error::Valores em formato inesperado (confira o que foi colado):$bad"
            exit 1
          fi
          echo "site_url=$NEXT_PUBLIC_SITE_URL" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "::notice::Versão de teste não publicada: faltam no ambiente 'bia-store' do GitHub:$missing (ver docs/deploy-teste.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci

      - name: Banco de teste (migrations)
        if: steps.cfg.outputs.ok == 'true'
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Catálogo de demonstração e acesso de administradora
        if: steps.cfg.outputs.ok == 'true'
        env:
          SUPABASE_URL: ${{ vars.TESTE_SUPABASE_URL || secrets.TESTE_SUPABASE_URL }}
          ADMIN_EMAIL: ${{ vars.TESTE_ADMIN_EMAIL }}
        run: node scripts/demo-teste.mjs

      - name: Build para Cloudflare Workers
        if: steps.cfg.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.cfg.outputs.site_url }}
        run: npm run cf:build

      - name: Publicar (workers.dev, ambiente preview)
        if: steps.cfg.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.cfg.outputs.site_url }}
        run: npx wrangler deploy --env preview --var "NEXT_PUBLIC_SITE_URL:${NEXT_PUBLIC_SITE_URL}" --var "NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL}" --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

      - name: Segredos do Worker
        if: steps.cfg.outputs.ok == 'true'
        env:
          CRON_SECRET: ${{ secrets.TESTE_CRON_SECRET || secrets.CRON_SECRET }}
        run: |
          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --env preview
          if [ -n "$CRON_SECRET" ]; then printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET --env preview; fi

      - name: Endereço publicado
        if: steps.cfg.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.cfg.outputs.site_url }}
        run: echo "::notice::Versão de teste publicada em $NEXT_PUBLIC_SITE_URL"
