name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Supabase local (migrations + seed)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,inbucket,mailpit
      - name: Chaves do Supabase local para testes e build
        run: |
          npx supabase status -o env | sed -nE 's/^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)="?([^"]*)"?$/\1=\2/p' > /tmp/sb.env
          echo "::add-mask::$(grep ^SECRET_KEY= /tmp/sb.env | cut -d= -f2-)"
          {
            echo "TEST_SUPABASE_URL=$(grep ^API_URL= /tmp/sb.env | cut -d= -f2-)"
            echo "TEST_SUPABASE_ANON_KEY=$(grep ^PUBLISHABLE_KEY= /tmp/sb.env | cut -d= -f2-)"
            echo "TEST_SUPABASE_SECRET_KEY=$(grep ^SECRET_KEY= /tmp/sb.env | cut -d= -f2-)"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep ^API_URL= /tmp/sb.env | cut -d= -f2-)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep ^PUBLISHABLE_KEY= /tmp/sb.env | cut -d= -f2-)"
          } >> "$GITHUB_ENV"
      - name: Testes de banco (RLS, estoque, encomendas, pagamentos)
        run: npm run test:db
        env:
          REQUIRE_DB_TESTS: "1"
      - run: npm run build
      - name: Build para Cloudflare Workers
        run: npm run cf:build
      - if: always()
        run: npx supabase stop --no-backup || true
